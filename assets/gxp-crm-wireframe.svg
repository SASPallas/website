<svg width="1600" height="1080" viewBox="0 0 1600 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GxP Intelligence CRM demo wireframe</title>
  <desc id="desc">Wireframe for a regulated workflow product showing a lean vertical milestone tracker on the left and a larger execution panel on the right with tasks, approvals, evidence, and regulatory logic generated from the Cell Orchestration Platform validation plan.</desc>
  <defs>
    <style>
      .sans { font-family: "Manrope", "Inter", "Segoe UI", Arial, sans-serif; }
      .serif { font-family: "Manrope", "Inter", "Segoe UI", Arial, sans-serif; }
      .ink { fill: #16283D; }
      .muted { fill: #607287; }
      .line { stroke: #C8D4E2; }
      .line-strong { stroke: #A7B8CB; }
      .panel { fill: #FFFFFF; stroke: #D6E0EA; }
      .panel-soft { fill: #F7FAFC; stroke: #D6E0EA; }
      .panel-blue { fill: #EEF4FB; stroke: #C7D8EC; }
      .rail { fill: #FBFCFD; stroke: #D6E0EA; }
      .blue { fill: #2757A5; }
      .blue-stroke { stroke: #2757A5; }
      .teal { fill: #1F7A73; }
      .teal-stroke { stroke: #1F7A73; }
      .label-sm { fill: #607287; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .label { fill: #16283D; font-size: 16px; font-weight: 600; }
      .body { fill: #607287; font-size: 15px; font-weight: 500; }
      .body-sm { fill: #607287; font-size: 13px; font-weight: 500; }
      .body-xs { fill: #8090A3; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
      .hero { fill: #16283D; font-size: 30px; font-weight: 700; }
      .title { fill: #16283D; font-size: 24px; font-weight: 700; }
      .title-sm { fill: #16283D; font-size: 20px; font-weight: 700; }
      .number { fill: #16283D; font-size: 15px; font-weight: 700; }
      .status { fill: #1F7A73; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      .status-muted { fill: #8090A3; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#F4F8FB"/>

  <rect x="48" y="36" width="1504" height="1008" rx="28" class="panel"/>

  <rect x="48" y="36" width="1504" height="74" rx="28" class="panel-soft"/>
  <circle cx="96" cy="73" r="18" fill="#2757A5" opacity="0.14"/>
  <text x="96" y="79" text-anchor="middle" class="sans label">PA</text>
  <text x="132" y="80" class="sans title-sm">Pallas Analytics</text>
  <text x="420" y="80" class="sans body">Regulated Pipeline CRM</text>

  <rect x="1180" y="57" width="132" height="34" rx="17" class="panel-blue"/>
  <text x="1246" y="79" text-anchor="middle" class="sans status">document parsed</text>
  <rect x="1326" y="57" width="170" height="34" rx="17" fill="#2757A5"/>
  <text x="1411" y="79" text-anchor="middle" class="sans" style="fill:#FFFFFF;font-size:14px;font-weight:700;">Request walkthrough</text>

  <text x="96" y="156" class="sans label-sm">Process intelligence workspace</text>
  <text x="96" y="204" class="serif hero">Validation plan converted into</text>
  <text x="96" y="240" class="serif hero">a live milestone workflow.</text>
  <text x="96" y="274" class="sans body">Upload a process document, generate milestone logic, break work into</text>
  <text x="96" y="296" class="sans body">actions and approvals, and validate completion before the next phase opens.</text>

  <rect x="96" y="332" width="280" height="96" rx="18" class="panel-blue"/>
  <text x="120" y="366" class="sans label-sm">Uploaded Source</text>
  <text x="120" y="396" class="sans title-sm">Cell Orchestration Platform</text>
  <text x="120" y="422" class="sans body-sm">Master Validation Plan v3.2 • 12 sections</text>

  <rect x="402" y="332" width="184" height="96" rx="18" class="panel-soft"/>
  <text x="426" y="366" class="sans label-sm">Generated</text>
  <text x="426" y="396" class="sans title">8 milestones</text>
  <text x="426" y="422" class="sans body-sm">Tasks, dependencies,</text>
  <text x="426" y="442" class="sans body-sm">and completion checks</text>

  <rect x="604" y="332" width="184" height="96" rx="18" class="panel-soft"/>
  <text x="628" y="366" class="sans label-sm">Controls</text>
  <text x="628" y="396" class="sans title">14 approvals</text>
  <text x="628" y="422" class="sans body-sm">Role-based signoff</text>
  <text x="628" y="442" class="sans body-sm">and evidence gates</text>

  <rect x="806" y="332" width="184" height="96" rx="18" class="panel-soft"/>
  <text x="830" y="366" class="sans label-sm">Regulatory Logic</text>
  <text x="830" y="396" class="sans title">FDA + EU</text>
  <text x="830" y="422" class="sans body-sm">Part 11, Annex 11,</text>
  <text x="830" y="442" class="sans body-sm">retention overlays</text>

  <rect x="96" y="462" width="286" height="514" rx="24" class="rail"/>
  <text x="126" y="502" class="sans label-sm">Milestone tracker</text>
  <text x="126" y="535" class="sans title-sm">Generated from the uploaded plan</text>

  <line x1="160" y1="584" x2="160" y2="910" class="line-strong" stroke-width="4"/>

  <circle cx="160" cy="612" r="18" fill="#1F7A73"/>
  <text x="160" y="618" text-anchor="middle" class="sans" style="fill:#FFFFFF;font-size:13px;font-weight:700;">1</text>
  <text x="196" y="605" class="sans status">validated</text>
  <text x="196" y="630" class="sans label">Scope and intended use</text>
  <text x="196" y="653" class="sans body-sm">Owner, system boundary, validation strategy</text>

  <circle cx="160" cy="692" r="18" fill="#1F7A73"/>
  <text x="160" y="698" text-anchor="middle" class="sans" style="fill:#FFFFFF;font-size:13px;font-weight:700;">2</text>
  <text x="196" y="685" class="sans status">validated</text>
  <text x="196" y="710" class="sans label">Requirements baseline</text>
  <text x="196" y="733" class="sans body-sm">URS traceability, change lock, approvers</text>

  <circle cx="160" cy="772" r="20" fill="#2757A5"/>
  <circle cx="160" cy="772" r="33" fill="none" class="blue-stroke" stroke-width="2" opacity="0.24"/>
  <text x="160" y="778" text-anchor="middle" class="sans" style="fill:#FFFFFF;font-size:13px;font-weight:700;">3</text>
  <text x="196" y="765" class="sans" style="fill:#2757A5;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;">active</text>
  <text x="196" y="790" class="sans label">Risk and control mapping</text>
  <text x="196" y="813" class="sans body-sm">High-risk functions, mitigations, evidence links</text>

  <circle cx="160" cy="852" r="18" fill="#DDE6F0"/>
  <text x="160" y="858" text-anchor="middle" class="sans number">4</text>
  <text x="196" y="845" class="sans status-muted">next</text>
  <text x="196" y="870" class="sans label">Protocol approval</text>
  <text x="196" y="893" class="sans body-sm">IQ/OQ/PQ or equivalent test package</text>

  <circle cx="160" cy="922" r="18" fill="#DDE6F0"/>
  <text x="160" y="928" text-anchor="middle" class="sans number">5</text>
  <text x="196" y="915" class="sans status-muted">blocked</text>
  <text x="196" y="940" class="sans label">Execution and evidence</text>
  <text x="196" y="963" class="sans body-sm">Locked until milestone 3 and 4 validate</text>

  <rect x="410" y="412" width="1094" height="564" rx="24" class="panel"/>
  <text x="446" y="452" class="sans label-sm">Active milestone</text>
  <text x="446" y="486" class="sans title">03. Risk and control mapping</text>
  <text x="446" y="515" class="sans body">The system has extracted the required work from the Cell Orchestration Platform validation plan</text>
  <text x="446" y="537" class="sans body">and translated it into actions, approvals, and completion rules.</text>

  <rect x="1238" y="438" width="230" height="40" rx="20" class="panel-blue"/>
  <text x="1353" y="463" text-anchor="middle" class="sans" style="fill:#2757A5;font-size:14px;font-weight:700;">82% complete • waiting on QA</text>

  <rect x="446" y="550" width="500" height="386" rx="18" class="panel-soft"/>
  <text x="474" y="588" class="sans label-sm">Tasks and checklists</text>
  <text x="474" y="620" class="sans title-sm">Required actions</text>

  <rect x="474" y="650" width="444" height="56" rx="14" class="panel"/>
  <rect x="492" y="668" width="20" height="20" rx="6" fill="#1F7A73"/>
  <path d="M497 678L501 682L508 674" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="528" y="681" class="sans label">Identify high-risk functions in scope</text>
  <text x="528" y="700" class="sans body-xs">Source: section 4.2 • mapped to risk table</text>

  <rect x="474" y="718" width="444" height="56" rx="14" class="panel"/>
  <rect x="492" y="736" width="20" height="20" rx="6" fill="#1F7A73"/>
  <path d="M497 746L501 750L508 742" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="528" y="749" class="sans label">Link each function to a control and owner</text>
  <text x="528" y="768" class="sans body-xs">Source: section 4.3 • owner assignment required</text>

  <rect x="474" y="786" width="444" height="56" rx="14" class="panel-blue"/>
  <rect x="492" y="804" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#2757A5" stroke-width="2"/>
  <text x="528" y="817" class="sans label">Attach supporting evidence for high-risk items</text>
  <text x="528" y="836" class="sans body-xs">Blocked until test protocol references are linked</text>

  <rect x="474" y="854" width="444" height="56" rx="14" class="panel"/>
  <rect x="492" y="872" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#A7B8CB" stroke-width="2"/>
  <text x="528" y="885" class="sans label">Record residual risk rationale</text>
  <text x="528" y="904" class="sans body-xs">Source: section 4.5 • required before approval</text>

  <rect x="970" y="550" width="244" height="386" rx="18" class="panel-soft"/>
  <text x="998" y="588" class="sans label-sm">Approvals and evidence</text>
  <text x="998" y="620" class="sans title-sm">Completion gates</text>

  <text x="998" y="662" class="sans status">approvals</text>
  <rect x="998" y="678" width="188" height="44" rx="12" class="panel"/>
  <text x="1016" y="705" class="sans label">Validation lead signed</text>
  <text x="1016" y="720" class="sans body-xs">Approved • 2026-05-05</text>

  <rect x="998" y="732" width="188" height="44" rx="12" class="panel-blue"/>
  <text x="1016" y="759" class="sans label">QA reviewer signoff</text>
  <text x="1016" y="774" class="sans body-xs">Pending • role required to advance</text>

  <text x="998" y="822" class="sans status">evidence</text>
  <rect x="998" y="838" width="188" height="44" rx="12" class="panel"/>
  <text x="1016" y="865" class="sans label">Risk register linked</text>
  <text x="1016" y="880" class="sans body-xs">Attached • version locked</text>

  <rect x="998" y="892" width="188" height="44" rx="12" class="panel-blue"/>
  <text x="1016" y="919" class="sans label">Traceability matrix</text>
  <text x="1016" y="934" class="sans body-xs">Missing test reference mapping</text>

  <rect x="1238" y="550" width="230" height="386" rx="18" class="panel-soft"/>
  <text x="1266" y="588" class="sans label-sm">Regulatory logic</text>
  <text x="1266" y="620" class="sans title-sm">Overlay checks</text>

  <rect x="1266" y="650" width="174" height="96" rx="14" class="panel"/>
  <text x="1284" y="676" class="sans label">FDA GxP logic</text>
  <text x="1284" y="699" class="sans body-sm">21 CFR Part 11 control linkage,</text>
  <text x="1284" y="719" class="sans body-sm">change history, electronic</text>
  <text x="1284" y="739" class="sans body-sm">record integrity</text>

  <rect x="1266" y="758" width="174" height="96" rx="14" class="panel"/>
  <text x="1284" y="784" class="sans label">EU GxP logic</text>
  <text x="1284" y="807" class="sans body-sm">Annex 11 / Annex 15 checks,</text>
  <text x="1284" y="827" class="sans body-sm">reviewability, ownership,</text>
  <text x="1284" y="847" class="sans body-sm">archived records</text>

  <rect x="1266" y="866" width="174" height="74" rx="14" class="panel-blue"/>
  <text x="1284" y="892" class="sans label">Advance rule</text>
  <text x="1284" y="915" class="sans body-sm">Unlock milestone 4 only when</text>
  <text x="1284" y="935" class="sans body-sm">all validation gates pass</text>
</svg>
